<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bán hàng - Coffee Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-container { display: flex; gap: 20px; padding: 20px; }
        .menu-section { flex: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cart-section { flex: 1; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .product-card { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; border-radius: 5px; }
        .product-card:hover { border-color: #007bff; background: #f0f7ff; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px thin #eee; }
    </style>
</head>
<body>
    <div class="container" style="width: 1000px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>☕ Coffee Hub - Bán Hàng</h2>
            <button onclick="logout()" style="width: auto; background: #6c757d;">Đăng xuất</button>
        </div>

        <div class="order-container">
            <div class="menu-section" id="menuList">
                </div>

            <div class="cart-section">
                <h3>Giỏ hàng</h3>
                <div id="cartItems"></div>
                <hr>
                <h4>Tổng: <span id="totalPrice" style="color: red;">0</span> đ</h4>
                <button onclick="checkout()" style="width: 100%; background: #28a745;">THANH TOÁN</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) window.location.href = "index.html";

        let cart = [];

        async function loadMenu() {
            let res = await fetch('http://localhost:8080/api/products');
            let products = await res.json();
            let html = products.map(p => `
                <div class="product-card" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                    <strong>${p.name}</strong><br>
                    <span style="color: #e67e22;">${p.price.toLocaleString()} đ</span>
                </div>
            `).join('');
            document.getElementById("menuList").innerHTML = html;
        }

        function addToCart(id, name, price) {
            let item = cart.find(i => i.productId === id);
            if(item) item.quantity++;
            else cart.push({ productId: id, name, price, quantity: 1 });
            renderCart();
        }

        function renderCart() {
            let html = cart.map(i => `
                <div class="cart-item">
                    <span>${i.name} x ${i.quantity}</span>
                    <span>${(i.price * i.quantity).toLocaleString()} đ</span>
                </div>
            `).join('');
            document.getElementById("cartItems").innerHTML = html;
            let total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            document.getElementById("totalPrice").innerText = total.toLocaleString();
        }

        async function checkout() {
            if(cart.length === 0) return alert("Giỏ hàng trống!");
            
            let response = await fetch('http://localhost:8080/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, items: cart })
            });

            if(response.ok) {
                alert("Thanh toán thành công!");
                cart = [];
                renderCart();
            }
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        loadMenu();
    </script>
</body>
</html>
