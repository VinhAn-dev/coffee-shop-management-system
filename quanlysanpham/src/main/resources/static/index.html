<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Coffee Hub</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <h2>Coffee Manager</h2>
        
        <div class="input-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập username (vd: admin)">
        </div>

        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <i class="fa-solid fa-eye toggle-password" id="eyeIcon" onclick="togglePassword()"></i>
            </div>
        </div>

        <button onclick="login()">ĐĂNG NHẬP</button>
        
        <div id="message" style="color: red;"></div>
    </div>

    <script>
        // 1. Hàm xử lý bật/tắt hiển thị mật khẩu
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text"; // Hiện mật khẩu
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash"); // Đổi icon thành mắt gạch chéo
            } else {
                passwordInput.type = "password"; // Ẩn mật khẩu (dấu *)
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye"); // Đổi lại icon mắt thường
            }
        }

        // 2. Hàm xử lý Đăng nhập gọi xuống Server
        async function login() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;
            let msg = document.getElementById("message");

            msg.innerText = "Đang xử lý...";
            msg.style.color = "blue";

            try {
                // Gọi API Login (Cổng 8082 như mày vừa sửa)
                let response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    // Vì backend trả về text hoặc JSON rỗng nếu login sai, 
                    // cần kiểm tra kỹ body response
                    let userData = await response.text(); 
                    
                    if (userData) {
                        // Parse lại thành JSON
                        let data = JSON.parse(userData);
                        
                        msg.style.color = "green";
                        msg.innerText = "Đăng nhập thành công!";
                        
                        // Lưu thông tin user vào trình duyệt để dùng cho trang sau
                        localStorage.setItem("user", JSON.stringify(data));

                        // Chờ 1 giây rồi chuyển trang
                        setTimeout(() => {
                            // Logic chuyển trang dựa theo quyền
                            if(data.role === "ADMIN") {
                                window.location.href = "products.html"; // Admin vào trang quản lý
                            } else {
                                window.location.href = "order.html";    // Staff vào trang bán hàng
                            }
                        }, 1000);

                    } else {
                        msg.style.color = "red";
                        msg.innerText = "Sai tên đăng nhập hoặc mật khẩu!";
                    }
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Lỗi xác thực (Kiểm tra lại server)!";
                }
            } catch (error) {
                console.error(error);
                msg.style.color = "red";
                msg.innerText = "Không thể kết nối tới Server (Đảm bảo Server đang chạy)!";
            }
        }
        if(data.role === "ADMIN") {
    window.location.href = "admin-home.html"; // <-- Chuyển vào trang Dashboard mới
}
    </script>
</body>
</html>
