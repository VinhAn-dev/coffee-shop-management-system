<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử Đơn hàng</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { width: 900px; max-width: 95%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .status-PENDING { background: #ffc107; color: #000; }
        .status-COMPLETED { background: #28a745; color: #fff; }
        .status-CANCELLED { background: #dc3545; color: #fff; }
        .nav-link { margin-bottom: 20px; display: inline-block; text-decoration: none; color: #007bff; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <a href="admin-home.html" class="nav-link">← Quay lại Dashboard</a>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📊 Lịch sử Doanh thu</h2>
            <div>Tổng doanh thu: <span id="totalRevenue" style="color: red; font-weight: bold; font-size: 20px;">0 đ</span></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mã Đơn</th>
                    <th>Ngày tạo</th>
                    <th>Người tạo</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                </tbody>
        </table>
    </div>

    <script>
        // 1. Load danh sách đơn hàng
        async function loadOrders() {
            try {
                // Gọi API lấy tất cả đơn (Phải đảm bảo OrderController có hàm getAllOrders)
                let res = await fetch('http://localhost:8080/api/orders'); 
                if(!res.ok) throw new Error("Lỗi tải dữ liệu");
                
                let orders = await res.json();
                let html = '';
                let total = 0;

                // Sắp xếp đơn mới nhất lên đầu
                orders.sort((a, b) => b.id - a.id);

                orders.forEach(o => {
                    // Nếu đơn đã hoàn thành thì cộng vào doanh thu
                    if(o.status === 'COMPLETED') total += o.totalAmount;

                    // Format ngày tháng (ví dụ: 2026-01-05T10:00 -> 10:00 05/01/2026)
                    let date = new Date(o.createdDate).toLocaleString('vi-VN');

                    html += `
                        <tr>
                            <td>#${o.id}</td>
                            <td>${date}</td>
                            <td>NV ID: ${o.userId}</td> <td style="font-weight:bold;">${o.totalAmount.toLocaleString()} đ</td>
                            <td><span class="badge status-${o.status}">${o.status}</span></td>
                        </tr>
                    `;
                });

                document.getElementById("orderTableBody").innerHTML = html;
                document.getElementById("totalRevenue").innerText = total.toLocaleString() + " đ";

            } catch (e) {
                console.error(e);
                alert("Không thể tải lịch sử đơn hàng. Hãy chắc chắn bạn đã đăng nhập!");
            }
        }

        loadOrders();
    </script>
</body>
</html>
