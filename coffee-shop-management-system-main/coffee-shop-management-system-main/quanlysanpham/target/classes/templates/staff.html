<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-users-cog me-2"></i> Quản Lý Nhân Viên</span>
            <a href="/" class="btn btn-outline-light btn-sm">Về trang chủ</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-3 shadow-sm">
                    <h5 class="mb-3 text-primary">Thêm Nhân Viên Mới</h5>
                    
                    <form th:action="@{/admin/staff/add}" th:object="${staff}" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label">Họ tên:</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nhập họ tên" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập:</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu:</label>
                            <input type="text" th:field="*{password}" class="form-control" placeholder="Mật khẩu" required>
                        </div>

                        <button class="btn btn-primary w-100">Lưu lại</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3 text-success">Danh sách nhân viên</h5>
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Họ tên</th>
                                <th>Username</th>
                                <th>Mật khẩu</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${staffList}">
                                <td th:text="${s.id}"></td>
                                <td th:text="${s.fullName}"></td>
                                <td th:text="${s.username}"></td>
                                <td th:text="${s.password}"></td>
                                <td>
                                    <a th:href="@{/admin/staff/delete/{id}(id=${s.id})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Bạn có chắc muốn xóa nhân viên này?');">
                                       <i class="fas fa-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
