<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-users-cog me-2"></i> Quản Lý Nhân Viên</span>
            <a href="/admin-home.html" class="btn btn-outline-light btn-sm">Về trang chủ</a>
        </div>
    </nav>
    <div class="container">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Thêm Nhân Viên</h5>
                    <form action="/admin/staff/add" method="POST">
                        <input type="text" name="fullName" class="form-control mb-2" placeholder="Họ tên" required>
                        <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
                        <input type="text" name="password" class="form-control mb-2" placeholder="Mật khẩu" required>
                        <button class="btn btn-primary w-100">Lưu</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-3">
                    <h5 class="mb-3">Danh sách</h5>
                    <table class="table table-bordered">
                        <thead><tr><th>ID</th><th>Tên</th><th>Username</th><th>Pass</th><th>Xóa</th></tr></thead>
                        <tbody>
                            <tr th:each="staff : ${staffList}">
                                <td th:text="${staff.id}"></td>
                                <td th:text="${staff.fullName}"></td>
                                <td th:text="${staff.username}"></td>
                                <td th:text="${staff.password}"></td>
                                <td><a th:href="@{/admin/staff/delete/{id}(id=${staff.id})}" class="btn btn-danger btn-sm">Xóa</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
