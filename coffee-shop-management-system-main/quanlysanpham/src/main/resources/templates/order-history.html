<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lịch sử Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-history me-2"></i> Lịch Sử Đơn Hàng</span>
            <a href="/admin-home.html" class="btn btn-outline-light btn-sm">
                <i class="fas fa-home"></i> Về trang chủ
            </a>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Danh sách đơn</h4>

                <table class="table table-bordered table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Nhân viên</th>
                            <th>Ngày Tạo</th>
                            <th>Chi tiết món</th>
                            <th>Tổng Tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders.content}">
                            <td class="fw-bold" th:text="'#' + ${order.id}"></td>

                            <td>
                                <span class="badge bg-info text-dark" th:text="${order.staff != null ? order.staff.fullName : 'Admin'}"></span>>
                            </td>

                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>

                            <td>
                                <ul class="mb-0 ps-3">
                                    <li th:each="item : ${order.items}">
                                        <span class="fw-bold text-primary" th:text="${item.product.name}"></span>
                                        <span th:text="' (x' + ${item.quantity} + ')'"></span>
                                        <span class="text-muted small fst-italic"
                                            th:text="${#numbers.formatDecimal(item.priceAtOrder, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                    </li>
                                </ul>
                            </td>

                            <td class="text-success fw-bold fs-5"
                                th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                            </td>
                        </tr>
                    </tbody>
                </table>
                <!-- nút phân trang mỗi trang tối đa 10 đơn -->
                <nav aria-label="Page navigation" class="mt-4" th:if="${totalPages > 0}">
                    <ul class="pagination justify-content-center">
                        
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/history(page=${currentPage - 1})}">
                                <i class="fas fa-chevron-left"></i> Trước
                            </a>
                        </li>

                        <li class="page-item disabled">
                            <span class="page-link bg-light text-dark fw-bold" 
                                  th:text="'Trang ' + (${currentPage + 1}) + ' / ' + ${totalPages}">
                            </span>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/history(page=${currentPage + 1})}">
                                Sau <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                        
                    </ul>
                </nav>

                <div th:if="${orders.empty}" class="alert alert-warning text-center mt-3">
                    Chưa có đơn hàng nào được tạo!
                </div>
            </div>
        </div>
    </div>

</body>

</html>
