<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lịch sử Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-history me-2"></i> Lịch Sử Đơn Hàng</span>
            <a href="/" class="btn btn-outline-light btn-sm">
                <i class="fas fa-home"></i> Về trang chủ
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="card-title mb-0">Danh sách đơn hàng</h4>
                </div>

                <form action="/admin/history" method="get" class="row g-3 mb-4 p-3 bg-light border rounded">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Chọn ngày:</label>
                        <input type="date" name="date" class="form-control" th:value="${selectedDate}">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Tên nhân viên:</label>
                        <input type="text" name="staffName" class="form-control" 
                               placeholder="Nhập tên nhân viên..." th:value="${staffName}">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-1"></i> Tìm kiếm
                        </button>
                    </div>
                </form>

                <table class="table table-bordered table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Ngày Tạo</th>
                            <th>Nhân viên</th> 
                            <th>Chi tiết món</th>
                            <th>Tổng Tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="fw-bold" th:text="'#' + ${order.id}"></td>

                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                            
                            <td>
                                <span class="badge bg-info text-dark" 
                                      th:if="${order.createdBy != null}" 
                                      th:text="${order.createdBy.fullName}"></span>
                                <span class="text-muted" th:unless="${order.createdBy != null}">Ẩn danh</span>
                            </td>

                            <td>
                                <ul class="mb-0 ps-3">
                                    <li th:each="item : ${order.items}">
                                        <span class="fw-bold text-primary" th:text="${item.product.name}"></span>
                                        <span th:text="' (x' + ${item.quantity} + ')'"></span>
                                        <span class="text-muted small fst-italic"
                                            th:text="${#numbers.formatDecimal(item.priceAtOrder, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                    </li>
                                </ul>
                            </td>

                            <td class="text-success fw-bold fs-5"
                                th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div th:if="${orders.empty}" class="alert alert-warning text-center mt-3">
                    <i class="fas fa-exclamation-circle me-1"></i> Không tìm thấy đơn hàng nào phù hợp!
                </div>

                <nav aria-label="Page navigation" th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/admin/history(page=${currentPage - 1}, date=${selectedDate}, staffName=${staffName})}">
                                <i class="fas fa-chevron-left"></i> Trước
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/admin/history(page=${i}, date=${selectedDate}, staffName=${staffName})}"
                               th:text="${i + 1}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/admin/history(page=${currentPage + 1}, date=${selectedDate}, staffName=${staffName})}">
                                Sau <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

</body>
</html>
