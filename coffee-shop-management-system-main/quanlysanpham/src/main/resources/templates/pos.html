<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bán Hàng - Coffee Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
</head>
<body>

    <nav class="navbar navbar-coffee px-4 d-flex justify-content-between align-items-center" style="height: 60px;">
        <div class="fw-bold fs-5"><i class="fa-solid fa-mug-hot me-2"></i> COFFEE HUB POS</div>
        <div>
            <span class="me-3"><i class="fa-solid fa-user-tie me-1"></i> Chào, Nhân Viên</span>
            <button onclick="logout()" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </nav>

    <div class="row m-0">
        <div class="col-md-8 menu-section">
            <h5 class="text-primary mb-3"><i class="fa-solid fa-utensils"></i> Danh sách đồ uống</h5>
            <div class="row g-3">
                <div class="col-md-3 col-6" th:each="p : ${products}">
                    <div class="card product-card h-100 p-2 text-center" 
                         th:onclick="addToCart([[${p.id}]], [[${p.name}]], [[${p.price}]])">
                        <div class="card-body p-2">
                            <div class="mb-2 text-muted"><i class="fa-solid fa-coffee fa-2x"></i></div>
                            <h6 class="card-title fw-bold text-dark" th:text="${p.name}"></h6>
                            <p class="price-tag mb-0" 
                               th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 cart-section p-0 shadow">
            <div class="cart-header">
                Đơn hàng hiện tại
            </div>

            <div class="cart-items" id="cartList">
                <div class="text-center text-muted mt-5">
                    <i class="fa-solid fa-basket-shopping fa-3x mb-3 text-secondary"></i>
                    <p>Chưa có món nào...</p>
                </div>
            </div>

            <div class="cart-footer">
                <div class="d-flex justify-content-between align-items-end mb-3">
                    <span class="fw-bold fs-5">Tổng cộng:</span>
                    <span id="totalPrice" class="fw-bold fs-4 text-dark">0</span>
                </div>
                <button onclick="checkout()" class="btn btn-checkout w-100 py-3">
                    <i class="fa-solid fa-print me-2"></i> Thanh Toán & In Hóa Đơn
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = []; 

        // --- 1. CÁC HÀM XỬ LÝ GIỎ HÀNG (GIỮ NGUYÊN) ---
        function addToCart(id, name, price) {
            let existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ id: id, name: name, price: price, quantity: 1 });
            }
            renderCart();
        }

        function renderCart() {
            let cartHtml = document.getElementById("cartList");
            let totalHtml = document.getElementById("totalPrice");
            
            if (cart.length === 0) {
                cartHtml.innerHTML = `
                    <div class="text-center text-muted mt-5">
                        <i class="fa-solid fa-basket-shopping fa-3x mb-3 text-secondary"></i>
                        <p>Chưa có món nào...</p>
                    </div>`;
                totalHtml.innerText = "0";
                return;
            }

            let html = "";
            let total = 0;

            cart.forEach((item, index) => {
                let lineTotal = item.price * item.quantity;
                total += lineTotal;
                
                html += `
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
                    <div style="flex-grow: 1;">
                        <div class="fw-bold text-dark fs-6">${item.name}</div>
                        <div class="text-muted small mt-1">SL: ${item.quantity}</div>
                    </div>
                    
                    <div class="d-flex align-items-center">
                        <span class="fw-bold me-3 text-dark">${lineTotal.toLocaleString()} đ</span>
                        <button onclick="removeItem(${index})" class="btn btn-danger btn-remove">
                            <i class="fa-solid fa-minus small"></i>
                        </button>
                    </div>
                </div>`;
            });

            cartHtml.innerHTML = html;
            totalHtml.innerText = total.toLocaleString();
        }
        // xóa từng đơn vị 1 nếu ==1 thì xóa món khỏi bill
        function removeItem(index) {
            if(cart[index].quantity > 1){
                cart[index].quantity--;
            }else{
                cart.splice(index,1);
            }
            renderCart();
        }

        // --- 2. HÀM THANH TOÁN (ĐÃ SỬA LẠI ĐỂ IN BILL) ---
        async function checkout() {
            if (cart.length === 0) {
                alert("Giỏ hàng đang trống!");
                return;
            }

            if (!confirm("Xác nhận thanh toán đơn này?")) return;

            let dataToSend = cart.map(item => ({
                productId: item.id,
                quantity: item.quantity
            }));

            try {
                let response = await fetch('/api/orders/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSend)
                });

                // QUAN TRỌNG: Đọc dữ liệu JSON trả về từ Controller
                let data = await response.json();

                if (data.status === 'success') {
                    // 1. Thông báo thành công
                    alert(data.message); // Có thể bỏ dòng này nếu muốn in luôn cho nhanh
                    console.log("Server trả về ID: " + data.orderId);
                    // 2. LOGIC IN BILL (MỚI THÊM)
                    // Lấy ID đơn hàng server trả về để tạo link
                    let printUrl = '/order/print/' + data.orderId;
                    
                    // Mở cửa sổ in kích thước nhỏ (Popup)
                    window.open(printUrl, '_blank', 'width=480,height=700');

                    // 3. Dọn dẹp giỏ hàng
                    cart = []; 
                    renderCart();
                    
                    // Reload trang để cập nhật mọi thứ mới tinh (Optional)
                    location.reload(); 
                } else {
                    alert(" Lỗi: " + data.message);
                }

            } catch (e) {
                console.error(e);
                alert("Lỗi: Không kết nối được server");
            }
        }
        
        function logout() {
            window.location.href = "/";
        }
    </script>
</body>
</html>
