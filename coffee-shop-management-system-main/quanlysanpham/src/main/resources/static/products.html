<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Món - Coffee Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { width: 800px; max-width: 90%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; cursor: pointer;}
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Quản lý Thực Đơn</h2>
            <button onclick="logout()" style="width: auto; background: #6c757d;">Đăng xuất</button>
        </div>

        <div class="form-group">
            <input type="text" id="pName" placeholder="Tên món (vd: Cafe Sữa)" style="flex: 2;">
            <input type="number" id="pPrice" placeholder="Giá (vd: 25000)" style="flex: 1;">
            <button onclick="addProduct()" style="width: auto;">Thêm Món</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Món</th>
                    <th>Giá</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                </tbody>
        </table>
    </div>

    <script>
        // 1. Kiểm tra đăng nhập (Bảo mật cơ bản)
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user || user.role !== "ADMIN") {
            alert("Bạn không có quyền truy cập!");
            window.location.href = "index.html";
        }

        // 2. Load danh sách món khi mở trang
        async function loadProducts() {
            try {
                let res = await fetch('http://localhost:8080/api/products'); // Cổng 8080
                let products = await res.json();
                
                let html = '';
                products.forEach(p => {
                    html += `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.name}</td>
                            <td>${p.price.toLocaleString()} đ</td>
                            <td>
                                <button class="btn-delete" onclick="deleteProduct(${p.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById("productTableBody").innerHTML = html;
            } catch (e) { console.error(e); }
        }

        // 3. Hàm thêm món
        async function addProduct() {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;

            if(!name || !price) return alert("Vui lòng nhập đủ thông tin!");

            await fetch('http://localhost:8080/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, price: parseFloat(price) })
            });

            // Xóa form và load lại bảng
            document.getElementById("pName").value = "";
            document.getElementById("pPrice").value = "";
            loadProducts();
        }

        // 4. Hàm xóa món
        async function deleteProduct(id) {
            if(confirm("Bạn chắc chắn muốn xóa món này?")) {
                await fetch('http://localhost:8080/api/products/' + id, { method: 'DELETE' });
                loadProducts();
            }
        }

        // 5. Hàm đăng xuất
        function logout() {
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        // Chạy hàm load khi trang vừa mở
        loadProducts();
    </script>
    <div class="container">
    <a href="admin-home.html" style="text-decoration: none; color: #007bff; font-weight: bold; display: block; margin-bottom: 10px;">← Quay lại Dashboard</a>
    
    <div style="display: flex;">
</body>

</html>
