<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Coffee Hub</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <h2>Coffee Manager</h2>
        
        <div class="input-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập username (vd: admin)">
        </div>

        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <i class="fa-solid fa-eye toggle-password" id="eyeIcon" onclick="togglePassword()"></i>
            </div>
        </div>

        <button onclick="login()">ĐĂNG NHẬP</button>
        
        <div id="message" style="color: red; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <script>
        // 1. Hàm bật/tắt hiển thị mật khẩu
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        // 2. Hàm Đăng nhập (Đã sửa lỗi)
        async function login() {
            // Lấy giá trị từ ô nhập
            let u = document.getElementById("username").value;
            let p = document.getElementById("password").value;
            let msg = document.getElementById("message");

            //nếu ô nhập tài khoản trống thì báo lõi
            if(u == "" || p == ""){
                msg.style.color = "red";
                msg.innerText = "Vui lòng nhập đầy đủ tài khoản và mật khẩu!";
            }
            // Reset thông báo
            msg.innerText = "Đang xử lý...";
            msg.style.color = "blue";

            try {
                // Gọi API Login
                let response = await fetch('http://localhost:8080/api/auth/staff/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // username lấy giá trị của biến u, password lấy của p
                    body: JSON.stringify({ 
                        username: u, 
                        password: p 
                    })
                });

                if (response.ok) {
                    // Đăng nhập thành công -> Lấy dữ liệu user trả về
                    let data = await response.json();
                    
                    msg.style.color = "green";
                    msg.innerText = "Đăng nhập thành công!";
                    
                    // Lưu vào localStorage
                    localStorage.setItem("user", JSON.stringify(data));

                    // Chờ 1 xíu rồi chuyển trang
                    setTimeout(() => {
                        if(data.role === "ADMIN") {
                            window.location.href = "admin-home.html"; // Vào trang Dashboard Admin
                        } else if(data.role == "STAFF") {
                            window.location.href = "order.html"; // trang bán hàng cho Staff
                        }else{
                            alert("Tài khoản này chưa được cấp quyền!");
                        }
                    }, 500);

                } else {
                    msg.style.color = "red";
                    
                    try {
                        // Lấy dữ liệu lỗi từ Backend
                        let errorData = await response.json();
                        
                        // Nếu Backend gửi kèm message (như mình đã cấu hình) thì hiện nó ra
                        if (errorData.message) {
                            msg.innerText = errorData.message; 
                        } else {
                            // Phòng hờ nếu lỗi lạ không có message
                            msg.innerText = "Tài khoản hoặc mật khẩu sai";
                        }
                    } catch (e) {
                        msg.innerText = "Lỗi kết nối hoặc lỗi server";
                    }
                }
            } catch (error) {
                console.error(error);
                msg.style.color = "red";
                msg.innerText = "Không thể kết nối Server";
            }
        }

        //event cho phần đăng nhập chỉ cần nhấn enter
        document.addEventListener("DOMContentLoaded", function() {
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        // 1. Xử lý tại ô USERNAME
        usernameInput.addEventListener("keydown", function(event) {
            // Nếu bấm Enter HOẶC Mũi tên Xuống
            if (event.key === "Enter" || event.key === "ArrowDown") {
                event.preventDefault(); // Chặn hành động mặc định
                passwordInput.focus();  // Nhảy xuống ô mật khẩu
            }
        });

        // 2. Xử lý tại ô PASSWORD
        passwordInput.addEventListener("keydown", function(event) {
            // Nếu bấm Mũi tên Lên
            if (event.key === "ArrowUp") {
                event.preventDefault();
                usernameInput.focus();  // Quay ngược lên ô tài khoản (để sửa nếu nhập sai)
            }
            
            // Nếu bấm Enter
            if (event.key === "Enter") {
                event.preventDefault();
                login(); // Gọi hàm đăng nhập luôn
            }
        });
    });
    </script>
</body>
</html>
