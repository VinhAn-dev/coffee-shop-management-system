<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản lý - Coffee Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-home.css">
    
</head>
<body>

    <div class="navbar">
        <h2 style="margin:0"><i class="fa-solid fa-mug-hot"></i> Coffee Hub Admin</h2>
        <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>

    <div class="container">
        <h1>Bảng Điều Khiển Quản Trị</h1>
        <p>Chào mừng quay trở lại, vui lòng chọn một tác vụ để tiếp tục</p>
        
        <div class="dashboard-menu">
            
            <a href="/products" class="card">
                <i class="fa-solid fa-utensils"></i>
                <h3>Quản lý Thực Đơn</h3>
                <p>Cập nhật danh sách đồ uống</p>
            </a>
            
            <a href="/admin/history" class="card">
                <i class="fa-solid fa-receipt"></i>
                <h3>Lịch sử Đơn Hàng</h3>
                <p>Xem doanh thu và hóa đơn</p>
            </a>

            <a href="/admin/staff" class="card">
                <i class="fa-solid fa-users-gear"></i>
                <h3>Quản lý Nhân Viên</h3>
                <p>Thêm, xóa và quản lý tài khoản</p>
            </a>

        </div>
    </div>

    <script>
        function logout() { 
            // 1. Xóa thông tin đăng nhập trong bộ nhớ trình duyệt
            localStorage.removeItem("user"); 
            
            // 2. Thông báo và chuyển về trang đăng nhập (index.html)
            if(confirm("Bạn có chắc chắn muốn đăng xuất?")) {
                window.location.href = "index.html"; 
            }
        }

        // Kiểm tra bảo mật: Nếu chưa đăng nhập thì đá về trang login ngay
        // (Phòng trường hợp gõ link trực tiếp mà không đăng nhập)
        window.onload = function() {
            const user = localStorage.getItem("user");
            if (!user) {
                // Nếu chưa có user trong localStorage -> Về trang login
                // window.location.href = "index.html"; 
            }
        }
    </script>
</body>
</html>
