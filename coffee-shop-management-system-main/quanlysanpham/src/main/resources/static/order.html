<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bán hàng - Coffee Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6F4E37; --secondary: #A67B5B; --bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .main-layout { display: flex; flex: 1; overflow: hidden; gap: 20px; padding: 20px; }
        
        /* Danh sách món */
        .menu-container { flex: 2; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; align-content: start; }
        .product-card { 
            background: white; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid transparent;
        }
        .product-card:hover { border-color: var(--secondary); transform: translateY(-3px); }
        .product-card i { font-size: 30px; color: var(--secondary); margin-bottom: 10px; }
        .price { color: var(--primary); font-weight: bold; }

        /* Giỏ hàng */
        .cart-panel { flex: 1; background: white; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; }
        .cart-items { flex: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .total-section { border-top: 2px solid var(--bg); padding-top: 20px; margin-top: 20px; }
        .btn-pay { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0"><i class="fa-solid fa-mug-hot"></i> COFFEE HUB - Quầy Thu Ngân</h2>
        <button onclick="logout()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 15px; border-radius:8px; cursor:pointer;">Đăng xuất</button>
    </div>

    <div class="main-layout">
        <div class="menu-container" id="menuList"></div>

        <div class="cart-panel">
            <h3 style="border-bottom: 2px solid var(--bg); padding-bottom: 15px;"><i class="fa-solid fa-cart-shopping"></i> Chi tiết đơn hàng</h3>
            <div id="cartItems" class="cart-items"></div>
            
            <div class="total-section">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:20px; font-weight:bold;">
                    <span>TỔNG CỘNG:</span>
                    <span id="totalPrice" style="color:#e74c3c;">0 đ</span>
                </div>
                <button class="btn-pay" onclick="checkout()">XÁC NHẬN THANH TOÁN</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) window.location.href = "index.html";

        let cart = [];

        async function loadMenu() {
            let res = await fetch('http://localhost:8080/api/products');
            let data = await res.json();
            document.getElementById("menuList").innerHTML = data.map(p => `
                <div class="product-card" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                    <i class="fa-solid fa-mug-saucer"></i>
                    <div style="font-weight:bold; margin-bottom:5px;">${p.name}</div>
                    <div class="price">${p.price.toLocaleString()} đ</div>
                </div>
            `).join('');
        }

        function addToCart(id, name, price) {
            let item = cart.find(i => i.productId === id);
            if(item) item.quantity++;
            else cart.push({ productId: id, name, price, quantity: 1 });
            renderCart();
        }

        function renderCart() {
            document.getElementById("cartItems").innerHTML = cart.map((i, index) => `
                <div class="cart-item">
                    <span>${i.name} <strong>x${i.quantity}</strong></span>
                    <span>${(i.price * i.quantity).toLocaleString()} đ <i class="fa-solid fa-circle-xmark" style="color:#ddd; cursor:pointer; margin-left:8px;" onclick="removeFromCart(${index})"></i></span>
                </div>
            `).join('');
            let total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            document.getElementById("totalPrice").innerText = total.toLocaleString() + " đ";
        }

        function removeFromCart(index) { cart.splice(index, 1); renderCart(); }

        async function checkout() {
            if(cart.length === 0) return alert("Giỏ hàng đang trống!");
            let res = await fetch('http://localhost:8080/api/orders', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, items: cart })
            });
            if(res.ok) { alert("🎉 Thanh toán thành công!"); cart = []; renderCart(); }
        }

        function logout() { localStorage.removeItem("user"); window.location.href = "index.html"; }
        loadMenu();
    </script>
</body>
</html>
